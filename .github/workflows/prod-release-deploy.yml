name: Production Release and Deploy

on:
  push:
    branches:
      - prod-release
  pull_request:
    branches:
      - prod-release
    types: [closed]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR title: $PR_TITLE"
          
          # Check if PR title follows the format "[Type] Description"
          if [[ ! "$PR_TITLE" =~ ^\[(Major|Minor|Patch|Feature|Fix|Breaking)\]\ .+ ]]; then
            echo "❌ PR title does not follow the required format '[Type] Description'"
            echo "Valid types: Major, Minor, Patch, Feature, Fix, Breaking"
            echo "Example: '[Feature] Add user authentication'"
            exit 1
          fi
          
          echo "✅ PR title format is valid"

  release-and-deploy:
    runs-on: ubuntu-latest
    needs: validate-pr-title
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: cr.yandex
          username: ${{ secrets.YC_REGISTRY_USERNAME }}
          password: ${{ secrets.YC_REGISTRY_PASSWORD }}

      - name: Get current version
        id: current_version
        run: |
          # Extract current version from CHANGELOG.md
          CURRENT_VERSION=$(grep -E '^\#\# \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | sed -E 's/.*\[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump type
        id: version_type
        run: |
          # Default to patch version bump
          VERSION_TYPE="patch"
          
          # If this is a PR merge, determine version type from PR title
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            echo "Determining version type from PR title: $PR_TITLE"
            
            if [[ "$PR_TITLE" =~ ^\[(Major|Breaking)\]\ .+ ]]; then
              VERSION_TYPE="major"
            elif [[ "$PR_TITLE" =~ ^\[(Minor|Feature)\]\ .+ ]]; then
              VERSION_TYPE="minor"
            elif [[ "$PR_TITLE" =~ ^\[(Patch|Fix)\]\ .+ ]]; then
              VERSION_TYPE="patch"
            fi
          fi
          
          echo "VERSION_TYPE=$VERSION_TYPE" >> $GITHUB_ENV
          echo "Version bump type: $VERSION_TYPE"

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT_VERSION=$CURRENT_VERSION
          VERSION_PARTS=(${CURRENT_VERSION//./ })
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Increment version based on type
          case $VERSION_TYPE in
            "major")
              NEW_MAJOR=$((MAJOR + 1))
              NEXT_VERSION="$NEW_MAJOR.0.0"
              ;;
            "minor")
              NEW_MINOR=$((MINOR + 1))
              NEXT_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            "patch"|*)
              NEW_PATCH=$((PATCH + 1))
              NEXT_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
          esac
          
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Next version: $NEXT_VERSION (bumped $VERSION_TYPE)"

      - name: Update CHANGELOG.md
        run: |
          # Add release date to current version
          sed -i "s/## \[$CURRENT_VERSION\] - 2025-01-XX/## [$CURRENT_VERSION] - $(date +%Y-%m-%d)/" CHANGELOG.md
          
          # Add new unreleased section for next version
          sed -i "1i## [Unreleased]

### Added
### Changed
### Deprecated
### Removed
### Fixed
### Security

## [$NEXT_VERSION] - $(date +%Y-%m-%d)
" CHANGELOG.md

      - name: Update go.mod with version
        run: |
          # Add version comment to go.mod
          sed -i "1i// Version: $CURRENT_VERSION
" go.mod

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:${{ env.NEXT_VERSION }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:latest

      - name: Create Git tag
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Release version $NEXT_VERSION"
          git tag -a "v$NEXT_VERSION" -m "Release version $NEXT_VERSION"
          git push origin "v$NEXT_VERSION"

      - name: Deploy to Yandex Cloud VM
        run: |
          # Deploy to Yandex Cloud VM
          echo "Deploying version $NEXT_VERSION to Yandex Cloud VM (ID: fhmf3i36jq46rgl67sme)"
          
          # Example deployment steps:
          # 1. SSH into the VM
          # 2. Pull the new Docker image
          # 3. Stop current containers
          # 4. Start new containers with the updated image
          # 5. Run database migrations if needed
          
          echo "Deployment steps would include:"
          echo "1. Connecting to Yandex Cloud VM (ID: fhmf3i36jq46rgl67sme)"
          echo "2. Pulling Docker image: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:$NEXT_VERSION"
          echo "3. Stopping current services"
          echo "4. Starting new services with updated image"
          echo "5. Running database migrations if needed"
          
          # Placeholder for actual deployment
          echo "DEPLOYMENT_STATUS=success" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEXT_VERSION }}
          release_name: Release v${{ env.NEXT_VERSION }}
          body: |
            Release of version ${{ env.NEXT_VERSION }}
            
            ## Changelog
            - Automated release from prod-release branch
            - Version bump type: ${{ env.VERSION_TYPE }}
            - Version bump from ${{ env.CURRENT_VERSION }} to ${{ env.NEXT_VERSION }}
          draft: false
          prerelease: false

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production release $NEXT_VERSION deployed successfully to Yandex Cloud VM"
          echo "Version: $NEXT_VERSION"
          echo "Version bump type: $VERSION_TYPE"
          echo "VM ID: fhmf3i36jq46rgl67sme"