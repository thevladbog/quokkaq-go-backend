name: Production Release and Deploy

on:
  push:
    branches:
      - prod-release

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker registry
        uses: docker/login-action@v2
        with:
          registry: registry.sourcecraft.dev
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Get current version
        id: current_version
        run: |
          # Extract current version from CHANGELOG.md
          CURRENT_VERSION=$(grep -E '^\#\# \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | sed -E 's/.*\[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate next version
        id: next_version
        run: |
          # For now, we'll increment the patch version
          # In a more advanced setup, we could analyze commits to determine version bump type
          CURRENT_VERSION=$CURRENT_VERSION
          VERSION_PARTS=(${CURRENT_VERSION//./ })
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Next version: $NEXT_VERSION"

      - name: Update CHANGELOG.md
        run: |
          # Add release date to current version
          sed -i "s/## \[$CURRENT_VERSION\] - 2025-01-XX/## [$CURRENT_VERSION] - $(date +%Y-%m-%d)/" CHANGELOG.md
          
          # Add new unreleased section for next version
          sed -i "1i## [Unreleased]

### Added
### Changed
### Deprecated
### Removed
### Fixed
### Security

## [$NEXT_VERSION] - $(date +%Y-%m-%d)
" CHANGELOG.md

      - name: Update go.mod with version
        run: |
          # Add version comment to go.mod
          sed -i "1i// Version: $CURRENT_VERSION
" go.mod

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.sourcecraft.dev/vladbogserg/quokkaq-go-backend:${{ env.NEXT_VERSION }}
            registry.sourcecraft.dev/vladbogserg/quokkaq-go-backend:latest

      - name: Create Git tag
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Release version $NEXT_VERSION"
          git tag -a "v$NEXT_VERSION" -m "Release version $NEXT_VERSION"
          git push origin "v$NEXT_VERSION"

      - name: Deploy to Yandex Cloud VM
        run: |
          # This is a simplified deployment process
          # In a real scenario, you would use Yandex Cloud CLI or SSH deployment
          echo "Deploying version $NEXT_VERSION to Yandex Cloud VM (ID: fhmf3i36jq46rgl67sme)"
          
          # Example deployment steps (these would need to be adapted for your specific setup):
          # 1. SSH into the VM
          # 2. Pull the new Docker image
          # 3. Stop current containers
          # 4. Start new containers with the updated image
          # 5. Run database migrations if needed
          
          echo "Deployment steps would include:"
          echo "1. Connecting to Yandex Cloud VM (ID: fhmf3i36jq46rgl67sme)"
          echo "2. Pulling Docker image: registry.sourcecraft.dev/vladbogserg/quokkaq-go-backend:$NEXT_VERSION"
          echo "3. Stopping current services"
          echo "4. Starting new services with updated image"
          echo "5. Running database migrations if needed"
          
          # Placeholder for actual deployment
          echo "DEPLOYMENT_STATUS=success" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEXT_VERSION }}
          release_name: Release v${{ env.NEXT_VERSION }}
          body: |
            Release of version ${{ env.NEXT_VERSION }}
            
            ## Changelog
            - Automated release from prod-release branch
            - Version bump from ${{ env.CURRENT_VERSION }} to ${{ env.NEXT_VERSION }}
          draft: false
          prerelease: false

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production release $NEXT_VERSION deployed successfully to Yandex Cloud VM"
          echo "Version: $NEXT_VERSION"
          echo "VM ID: fhmf3i36jq46rgl67sme"