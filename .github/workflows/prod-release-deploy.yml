name: Production Release and Deploy

permissions:
  contents: write

on:
  pull_request:
    branches:
      - prod-release
    types: [closed]

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'



      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: cr.yandex
          username: ${{ secrets.YC_REGISTRY_USERNAME }}
          password: ${{ secrets.YC_REGISTRY_PASSWORD }}

      - name: Get current version
        id: current_version
        run: |
          # Extract current version from CHANGELOG.md
          CURRENT_VERSION=$(grep -E '^\#\# \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | sed -E 's/.*\[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump type
        id: version_type
        run: |
          # Default to patch version bump
          VERSION_TYPE="patch"
          
          # If this is a PR merge, determine version type from PR title
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            echo "Determining version type from PR title: $PR_TITLE"
            
            if [[ "$PR_TITLE" =~ ^\[(Major|Breaking)\]\ .+ ]]; then
              VERSION_TYPE="major"
            elif [[ "$PR_TITLE" =~ ^\[(Minor|Feature)\]\ .+ ]]; then
              VERSION_TYPE="minor"
            elif [[ "$PR_TITLE" =~ ^\[(Patch|Fix)\]\ .+ ]]; then
              VERSION_TYPE="patch"
            fi
          fi
          
          echo "VERSION_TYPE=$VERSION_TYPE" >> $GITHUB_ENV
          echo "Version bump type: $VERSION_TYPE"

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT_VERSION=$CURRENT_VERSION
          VERSION_PARTS=(${CURRENT_VERSION//./ })
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Increment version based on type
          case $VERSION_TYPE in
            "major")
              NEW_MAJOR=$((MAJOR + 1))
              NEXT_VERSION="$NEW_MAJOR.0.0"
              ;;
            "minor")
              NEW_MINOR=$((MINOR + 1))
              NEXT_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            "patch"|*)
              NEW_PATCH=$((PATCH + 1))
              NEXT_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
          esac
          
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Next version: $NEXT_VERSION (bumped $VERSION_TYPE)"

      - name: Update CHANGELOG.md
        run: |
          # Add release date to current version
          sed -i "s/## \[$CURRENT_VERSION\] - 2025-01-XX/## [$CURRENT_VERSION] - $(date +%Y-%m-%d)/" CHANGELOG.md
          
          # Add new unreleased section for next version
          sed -i "1i## [Unreleased]

          ### Added
          ### Changed
          ### Deprecated
          ### Removed
          ### Fixed
          ### Security

          ## [$NEXT_VERSION] - $(date +%Y-%m-%d)
          " CHANGELOG.md

      - name: Update go.mod with version
        run: |
          # Add version comment to go.mod
          sed -i "1i// Version: $CURRENT_VERSION
          " go.mod

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:${{ env.NEXT_VERSION }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:latest

      - name: Create Git tag
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          # Commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release version $NEXT_VERSION"
          fi
          # Create tag if it doesn't already exist
          if git rev-parse -q --verify "refs/tags/v$NEXT_VERSION" >/dev/null; then
            echo "Tag v$NEXT_VERSION already exists"
          else
            git tag -a "v$NEXT_VERSION" -m "Release version $NEXT_VERSION"
          fi
          # Push tag using the checkout-provided credentials (GITHUB_TOKEN)
          git push origin "v$NEXT_VERSION"

      - name: Deploy to Yandex Cloud VM
        run: |
          # Deploy to Yandex Cloud VM
          echo "Deploying version $NEXT_VERSION to Yandex Cloud VM (ID: fhmf3i36jq46rgl67sme)"
          
          # Install Yandex Cloud CLI
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "Yandex Cloud CLI installed"
          
          # Configure Yandex Cloud CLI with service account key
          # Make sure `yc` is available in the current shell (installer updates ~/.bashrc)
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          hash -r || true
          echo "yc path: $(which yc 2>/dev/null || echo 'not found')"
          echo "${{ secrets.YC_SERVICE_ACCOUNT_KEY }}" > service-account-key.json
          "$HOME/yandex-cloud/bin/yc" config set service-account-key service-account-key.json
          
          # SSH into VM and deploy
          echo "Connecting to Yandex Cloud VM..."
            ssh -o StrictHostKeyChecking=no -i ${{ secrets.VM_SSH_KEY }} deploy@fhmf3i36jq46rgl67sme << 'EOF'
            echo "Connected to VM"
            
            # Create deployment directory if it doesn't exist
            mkdir -p /home/deploy/quokkaq
            cd /home/deploy/quokkaq
            
            # Create .env.prod file with production variables
            cat > .env.prod << 'ENV_END'
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          ENV_END
            
            # Pull the new Docker image
            echo "Pulling Docker image: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:${{ env.NEXT_VERSION }}"
            docker pull cr.yandex/${{ secrets.YC_REGISTRY_ID }}/quokkaq-backend:${{ env.NEXT_VERSION }}
            
            # Stop current services
            echo "Stopping current services..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod down
            
            # Start new services with the updated image
            echo "Starting new services..."
            TAG=${{ env.NEXT_VERSION }} docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            
            # Run database migrations
            echo "Running database migrations..."
            sleep 10
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec backend ./migrate
            
            # Check service health
            echo "Checking service health..."
            sleep 30
            curl -f http://localhost:3001/ || echo "Health check failed"
            
            echo "Deployment completed successfully"
          EOF
          
          echo "✅ Deployment to Yandex Cloud VM completed"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEXT_VERSION }}
          release_name: Release v${{ env.NEXT_VERSION }}
          body: |
            Release of version ${{ env.NEXT_VERSION }}
            
            ## Changelog
            - Automated release from prod-release branch
            - Version bump type: ${{ env.VERSION_TYPE }}
            - Version bump from ${{ env.CURRENT_VERSION }} to ${{ env.NEXT_VERSION }}
          draft: false
          prerelease: false

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production release $NEXT_VERSION deployed successfully to Yandex Cloud VM"
          echo "Version: $NEXT_VERSION"
          echo "Version bump type: $VERSION_TYPE"
          echo "VM ID: fhmf3i36jq46rgl67sme"