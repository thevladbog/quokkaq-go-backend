name: Validate PR Title

on:
  pull_request:
    branches:
      - prod-release
    types: [opened, edited, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        id: check_title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^\[(Major|Minor|Patch|Feature|Fix|Breaking)\]\ .+ ]]; then
            echo "invalid" >> $GITHUB_ENV
          else
            echo "valid" >> $GITHUB_ENV
          fi
      - name: Add PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = process.env.invalid ? 'invalid' : 'valid';
            if (result === 'valid') {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Проверка PR title прошла успешно. Можно продолжать работу.'
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ PR title не соответствует формату `[Type] Description`.\n\n**Как исправить:**\n- Переименуйте PR, чтобы он начинался с одного из типов: Major, Minor, Patch, Feature, Fix, Breaking.\n- Пример: `[Feature] Add user authentication`\n- После переименования, изменения автоматически проверятся повторно.'
              });
            }
