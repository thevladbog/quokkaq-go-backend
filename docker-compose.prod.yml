version: '3.8'

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: quokkaq-traefik
    restart: unless-stopped
    command:
      # Traefik configuration
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      
      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Uncomment for testing (uses staging server):
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik-public
      - quokkaq-network
    labels:
      # Traefik dashboard (optional, comment out in production if not needed)
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.quokkaq.v-b.tech`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth"
      # Basic auth for dashboard (user: admin, password: change-this - generate your own!)
      # Generate: echo $(htpasswd -nb admin your-password) | sed -e s/\\$/\\$\\$/g
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$apr1$$8evjzs0r$$I7.UPGPJXm/yNpGRBFICb."

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: quokkaq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-quokkaq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quokkaq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background jobs
  redis:
    image: redis:7-alpine
    container_name: quokkaq-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - quokkaq-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage
  minio:
    image: minio/minio:latest
    container_name: quokkaq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - quokkaq-network
      - traefik-public
    labels:
      # MinIO API
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`s3.quokkaq.v-b.tech`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio.quokkaq.v-b.tech`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # QuokkaQ Backend API
  backend:
    image: cr.yandex/${YC_REGISTRY_ID}/quokkaq-backend:${TAG}
    container_name: quokkaq-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quokkaq}
      PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL:-https://quokkaq.v-b.tech}
      
      # MinIO Configuration
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-quokkaq-materials}
      AWS_ENDPOINT: http://minio:9000
      
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - quokkaq-network
      - traefik-public
    labels:
      # Main API
      - "traefik.enable=true"
      - "traefik.http.routers.quokkaq-api.rule=Host(`api.quokkaq.v-b.tech`)"
      - "traefik.http.routers.quokkaq-api.entrypoints=websecure"
      - "traefik.http.routers.quokkaq-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.quokkaq-api.service=quokkaq-api"
      - "traefik.http.services.quokkaq-api.loadbalancer.server.port=3001"
      
      # CORS middleware
      - "traefik.http.middlewares.quokkaq-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.quokkaq-cors.headers.accesscontrolalloworiginlist=https://app.quokkaq.v-b.tech,https://quokkaq.v-b.tech"
      - "traefik.http.middlewares.quokkaq-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.quokkaq-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.quokkaq-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.quokkaq-cors.headers.accesscontrolallowcredentials=true"
      
      # Security headers
      - "traefik.http.middlewares.quokkaq-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.quokkaq-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.quokkaq-security.headers.stsPreload=true"
      - "traefik.http.middlewares.quokkaq-security.headers.forceSTSHeader=true"
      
      # Apply middlewares
      - "traefik.http.routers.quokkaq-api.middlewares=quokkaq-cors,quokkaq-security"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik-public:
    external: true
  quokkaq-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  traefik_letsencrypt:
    driver: local
